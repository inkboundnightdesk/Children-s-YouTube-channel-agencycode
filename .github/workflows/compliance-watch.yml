# Weekly (and on-demand) compliance watch.
# Fetches official sources and fails if anything moved.
# Does NOT rewrite rules.json or publish videos.
name: compliance-watch

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Watch official sources
        run: python3 compliance/fetch_compliance.py --watch
      - name: Freshness check
        if: always()
        run: python3 compliance/fetch_compliance.py --check || true
